name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # PySide6 views are imported by the suite; no display on runners.
      QT_QPA_PLATFORM: offscreen
      # Keep the audit trail out of the runner's home config dir.
      CHAOSGEN_AUDIT_LOG: ${{ github.workspace }}/.ci-artifacts/audit_events.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package with dev + gui extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Run test suite
        # Coverage floor (--cov-fail-under=70) comes from pytest.ini; a drop
        # below it fails the job.
        run: pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
