# Advanced AIO Chaos Tool Configuration
# This configuration demonstrates a comprehensive chaos testing setup

global:
  log_level: debug
  dry_run: false

modules:
  # Chaos Toolkit - For orchestrated experiments
  chaos-toolkit:
    experiment_path: "./experiments/microservices-experiment.json"
    rollback_enabled: true
  
  # Kube-Monkey - Kubernetes Pod Failures
  kube-monkey:
    namespace: production
    enabled: true
    max_kill: 3
    kill_value: 30  # Kill 30% of eligible pods
    # Time zone for scheduling
    # Run between business hours to test resilience
  
  # Pumba - Docker Container Failures
  pumba:
    target_containers:
      - "api-service"
      - "worker-service"
      - "queue-processor"
      - "cache-service"
    interval: "15s"
    # Can target multiple containers simultaneously
  
  # Chaos Monkey - AWS EC2 Failures
  chaos-monkey:
    enabled: true
    schedule_enabled: true
    accounts:
      - "123456789012"  # Production account
      - "987654321098"  # Staging account
    regions:
      - "us-east-1"
      - "us-west-2"
      - "eu-west-1"
    # Terminate instances during business hours to test auto-scaling
  
  # Toxiproxy - Network Chaos
  toxiproxy:
    host: localhost
    port: 8474
    proxies:
      # Redis proxy with potential latency
      - name: "redis"
        listen: "0.0.0.0:16379"
        upstream: "redis-server:6379"
      
      # PostgreSQL proxy with potential connection issues
      - name: "postgres"
        listen: "0.0.0.0:15432"
        upstream: "postgres-server:5432"
      
      # MongoDB proxy
      - name: "mongodb"
        listen: "0.0.0.0:27018"
        upstream: "mongo-server:27017"
      
      # Kafka proxy for message queue testing
      - name: "kafka"
        listen: "0.0.0.0:9093"
        upstream: "kafka-server:9092"
      
      # Elasticsearch proxy
      - name: "elasticsearch"
        listen: "0.0.0.0:9201"
        upstream: "es-server:9200"
  
  # Muxy - HTTP/TCP Disruption
  muxy:
    proxy_host: "0.0.0.0"
    proxy_port: 8181
    target_host: "api-gateway"
    target_port: 8080
    # Simulate real-world network conditions

