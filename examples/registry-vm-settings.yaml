# ChaosGen settings — microservices-demo registry-vm live stack (Way 1)
# Copy to ~/.config/chaosgen/settings.yaml or pass: chaosgen analyze --config examples/registry-vm-settings.yaml

hints:
  architecture: microservices
  environment: kubernetes
  skip_auto_detect: true
  observability:
    - tool: prometheus
      url: http://192.168.31.220:9090
      auth:
        auth_type: none
    - tool: loki
      url: http://192.168.31.220:3100
      auth:
        auth_type: none

llm_provider: ollama
llm_model: llama3.2:3b

# Gatekeeper (?? real ??) — frequency x severity matrix + strict log boost (P1)
gatekeeper:
  frequency_low_threshold: 0.5    # events/hour
  frequency_high_threshold: 2.0
  severity_low_threshold: 0.4
  severity_high_threshold: 0.75
  log_correlation_boost: true
  strict_log_boost: true
  severe_log_keywords: ["error", "fatal", "critical"]
  ignore_log_keywords: ["warning", "warn", "deprecation", "info"]
