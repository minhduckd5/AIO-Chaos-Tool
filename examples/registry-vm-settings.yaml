# ChaosGen settings — microservices-demo registry-vm live stack (Phase 2 aligned)
# Copy to ~/.config/chaosgen/settings.yaml or pass:
#   chaosgen analyze --config examples/registry-vm-settings.yaml
#
# Observability stack: registry-vm @ 10.50.1.220 (microservices-demo-1 Sprint A–C)
# Golden signals: form-first pack `boutique` (chaosgen/telemetry/packs/boutique.yaml)

hints:
  architecture: microservices
  environment: kubernetes
  skip_auto_detect: true
  observability:
    - tool: prometheus
      url: http://10.50.1.220:9090
      auth:
        auth_type: none
    - tool: loki
      url: http://10.50.1.220:3100
      auth:
        auth_type: none

llm_provider: ollama
llm_model: llama3.2:3b

# Live collection window — match Prometheus scrape (30s) with reasonable step
telemetry:
  default_lookback_hours: 24
  step: "15s"

anomaly:
  clustering_mode: auto
  n_clusters: 5
  min_clusters: 2
  max_clusters: 15
  contamination: 0.1
  default_model_path: models/merged_canonical.joblib

features:
  rolling_window_seconds: 300
  resample_step_seconds: 60
  zscore_threshold: 3.0
  canonical_enabled: true
  canonical_rules_path: examples/canonical_features.yaml

ingest:
  # Form-first packs — PromQL/LogQL live in chaosgen/telemetry/packs/
  telemetry_profile: boutique
  extra_packs:
    - cadvisor
    - loki_system
  scope_namespace: default
  allow_legacy_golden: true
  # Optional raw log streams (legacy); pack LogQL metrics are preferred for ML
  log_query: '{namespace="default", app=~".+"}'
  # Operator overrides only — empty by default (queries live in boutique.yaml)
  custom_promql: {}

advisor:
  confidence_threshold: 0.6
  top_n_scenarios: 5
  describer_max_retries: 2

ranking:
  weight_confidence: 0.35
  weight_historical: 0.25
  weight_coverage: 0.20
  weight_safety: 0.20
  recency_days: 7

safety:
  max_affected_nodes: 2
  max_affected_pods_percent: 20
  max_services_per_suite: 3
  blocked_namespaces: [kube-system, observability-agents]
  blocked_services: [redis-cart]

inject:
  enabled: true
  kubeconfig: ~/.kube/config
  default_namespace: default
  label_key: app
  dry_run: true
  chaos_backend: chaosmesh
  client: auto
  kubectl_timeout_s: 30
  delete_force_on_timeout: true
  prefer_self_expiring_chaos: true
  managed_by_label: chaosgen
  ephemeral_label: "true"
  ssh_bastion:
    enabled: false
    auto_on_api_fail: true
    host: 10.50.1.210
    user: vagrant
    remote_api_host: 127.0.0.1
    remote_api_port: 6443
    skip_tls_verify: false

gatekeeper:
  frequency_low_threshold: 0.5
  frequency_high_threshold: 2.0
  severity_low_threshold: 0.4
  severity_high_threshold: 0.75
  log_correlation_boost: true
  strict_log_boost: true
  severe_log_keywords: ["error", "fatal", "critical", "500", "unavailable"]
  ignore_log_keywords: ["warning", "warn", "deprecation", "info", "debug"]
