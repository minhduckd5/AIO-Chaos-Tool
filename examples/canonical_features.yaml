# Canonical signal-type pooling rules (v1).
# Raw FeatureEngineer columns are matched by regex; pooled with max() per bucket+stat.
# Pack aliases (pack__*) map into these buckets without bumping schema_version.

schema_version: "1"

stats:
  - mean
  - std
  - roc
  - p95

signals:
  cpu:
    - cpu
    - processor
    - cpu_usage
    - node_cpu
    - cfs_throttled
  memory:
    - mem
    - memory
    - ram
    - working_set
    - MemAvailable
    - memory_usage
  disk:
    - disk
    - io_
    - filesystem
    - fs_
    - storage
  network:
    - network
    - net_
    - _rx_
    - _tx_
    - receive_bytes
    - transmit_bytes
    - network_rx
    - network_tx
  latency:
    - latency
    - duration
    - histogram
    - p50
    - p95
    - p99
    - latency_p95
    - latency_p99
  errors:
    - error
    - 5xx
    - fail
    - exception
    - fault
    - error_rate
    - error_ratio
    - span_error
  request_rate:
    - request
    - qps
    - throughput
    - http_server
    - rpc_server
    - traffic_rate
    - request_rate
  saturation:
    - throttl
    - saturation
    - cfs
    - saturation_cpu
    - saturation_cpu_mem
  availability:
    - "\\bup\\b"
    - ready
    - alive
    - frontend_health
    - replicas_available

log_signals:
  log_volume:
    - log_volume
    - pack__log_volume
  log_error_rate:
    - log_error_rate
    - pack__log_error_rate

pooling: max
