# ChaosGen settings — modular monolith P0 live stack (WS-5)
# Copy to ~/.config/chaosgen/settings.yaml or pass:
#   chaosgen analyze --config examples/modular-monolith-settings.yaml
#
# Prerequisite: labs/modular-monolith/docker-compose.yml running locally.

hints:
  architecture: modular_monolith
  environment: docker_compose
  skip_auto_detect: true
  observability:
    - tool: prometheus
      url: http://127.0.0.1:19090
      auth:
        auth_type: none

llm_provider: ollama
llm_model: llama3.2:3b

telemetry:
  default_lookback_hours: 1
  step: "15s"

anomaly:
  clustering_mode: auto
  n_clusters: 3
  min_clusters: 2
  max_clusters: 8
  contamination: 0.1
  default_model_path: models/merged_canonical.joblib

features:
  rolling_window_seconds: 300
  resample_step_seconds: 60
  zscore_threshold: 5.0
  canonical_enabled: true
  canonical_rules_path: examples/canonical_features.yaml

ingest:
  custom_promql:
    monolith_probe: 'probe_success{instance="http://monolith-app/health"}'
    module_api_probe: 'probe_success{instance="http://module-api/health"}'
    redis_up: 'up{job="prometheus"}'

advisor:
  confidence_threshold: 0.6
  top_n_scenarios: 5
  describer_max_retries: 2

ranking:
  weight_confidence: 0.35
  weight_historical: 0.25
  weight_coverage: 0.20
  weight_safety: 0.20
  recency_days: 7

safety:
  max_affected_nodes: 2
  max_affected_pods_percent: 50
  max_services_per_suite: 3
  blocked_namespaces: [kube-system]
  blocked_services: []

# P0 — live Docker inject via Pumba (kill / pause / netem)
connect:
  docker:
    # Linux/WSL: unix:///var/run/docker.sock
    # Windows Docker Desktop: npipe:////./pipe/docker_engine
    host: npipe:////./pipe/docker_engine
    compose_file: labs/modular-monolith/docker-compose.yml
    project_name: chaosgen-monolith

inject:
  enabled: true
  dry_run: false
  # Pumba module is selected by architecture + docker_compose connect profile (WS-3/4)

gatekeeper:
  enabled: true
  require_human_approval: true

history:
  enabled: true
